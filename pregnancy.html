<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pregnancy Due Date Calculator — CalcHub</title>
  <meta name="description" content="Free pregnancy due date calculator. Estimate your baby's due date from LMP or conception.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text x='50' y='70' font-size='62' text-anchor='middle' fill='white' font-family='system-ui' font-weight='bold'>C</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="../index.html" class="logo"><span class="logo-dot"></span>CalcHub</a>
      <nav class="nav">
        <a href="../index.html#finance">Finance</a>
        <a href="../index.html#health">Health</a>
        <a href="../index.html#daily">Daily</a>
        <a href="../index.html#utility">Utility</a>
      </nav>
    </div>
  </header>

  <main class="calc-page">
    <div class="calc-container">
      <a href="../index.html" class="back-link">← All calculators</a>
      <h1>Pregnancy Due Date Calculator</h1>
      <p class="subtitle">Estimate your baby's due date.</p>

      <div class="form-group">
        <label for="method">Calculate Based On</label>
        <select id="method">
          <option value="lmp">Last Menstrual Period (LMP)</option>
          <option value="conception">Conception Date</option>
        </select>
      </div>
      <div class="form-group">
        <label for="startDate">Start Date</label>
        <input type="date" id="startDate">
      </div>
      <div class="form-group">
        <label for="cycle">Average Cycle Length (days)</label>
        <input type="number" id="cycle" value="28">
      </div>

      <button class="calc-btn" onclick="calcDueDate()"><span>Calculate Due Date</span></button>

      <div class="result" id="result">
        <h2>Estimated Due Date</h2>
        <div class="highlight" id="dueDate">—</div>
        <div class="result-item"><span class="label">Gestational Age</span><span class="value" id="gestAge">—</span></div>
        <div class="result-item"><span class="label">Trimester</span><span class="value" id="trimester">—</span></div>
        <div class="result-item"><span class="label">Days Remaining</span><span class="value" id="daysLeft">—</span></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand-col">
        <a href="../index.html" class="logo"><span class="logo-dot"></span>CalcHub</a>
        <p class="footer-tagline">Free calculators for finance, health, and daily life.</p>
      </div>
      <nav class="footer-nav">
        <a href="../about.html">About</a>
        <a href="../contact.html">Contact</a>
        <a href="../privacy.html">Privacy</a>
        <a href="../terms.html">Terms</a>
      </nav>
      <p class="footer-copy">© <span id="year"></span> CalcHub</p>
    </div>
  </footer>

  <script src="../script.js"></script>
  <script>
    const eightWeeksAgo = new Date(); eightWeeksAgo.setDate(eightWeeksAgo.getDate() - 56);
    document.getElementById('startDate').valueAsDate = eightWeeksAgo;
    function calcDueDate() {
      const method = document.getElementById('method').value;
      const s = document.getElementById('startDate').value;
      if (!s) return;
      const start = new Date(s);
      const cycle = parseFloat(document.getElementById('cycle').value) || 28;
      let due = new Date(start);
      due.setDate(due.getDate() + (method === 'lmp' ? 280 + (cycle - 28) : 266));
      const today = new Date();
      const daysLeft = Math.ceil((due - today) / 86400000);
      const lmpEq = method === 'lmp' ? new Date(start) : new Date(start.getTime() - 14 * 86400000);
      const gestDays = Math.floor((today - lmpEq) / 86400000);
      const gw = Math.floor(gestDays / 7), gr = gestDays % 7;
      let tri = gw < 13 ? 'First' : gw < 27 ? 'Second' : 'Third';
      document.getElementById('dueDate').textContent = due.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('gestAge').textContent = `${gw}w ${gr}d`;
      document.getElementById('trimester').textContent = tri;
      document.getElementById('daysLeft').textContent = daysLeft > 0 ? daysLeft + ' days' : 'Past due';
      showResult('result');
    }
  </script>
</body>
</html>
