<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compound Interest Calculator — CalcHub</title>
  <meta name="description" content="Free compound interest calculator. See how your money grows over time.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text x='50' y='70' font-size='62' text-anchor='middle' fill='white' font-family='system-ui' font-weight='bold'>C</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="../index.html" class="logo"><span class="logo-dot"></span>CalcHub</a>
      <nav class="nav">
        <a href="../index.html#finance">Finance</a>
        <a href="../index.html#health">Health</a>
        <a href="../index.html#daily">Daily</a>
        <a href="../index.html#utility">Utility</a>
      </nav>
    </div>
  </header>

  <main class="calc-page">
    <div class="calc-container">
      <a href="../index.html" class="back-link">← All calculators</a>
      <h1>Compound Interest Calculator</h1>
      <p class="subtitle">See how your investment grows over time.</p>

      <div class="form-group">
        <label for="principal">Initial Investment ($)</label>
        <input type="number" id="principal" value="10000">
      </div>
      <div class="form-group">
        <label for="monthly">Monthly Contribution ($)</label>
        <input type="number" id="monthly" value="200">
      </div>
      <div class="form-group">
        <label for="rate">Annual Interest Rate (%)</label>
        <input type="number" id="rate" value="7" step="0.01">
      </div>
      <div class="form-group">
        <label for="years">Years</label>
        <input type="number" id="years" value="20">
      </div>

      <button class="calc-btn" onclick="calcCompound()"><span>Calculate</span></button>

      <div class="result" id="result">
        <h2>Future Value</h2>
        <div class="highlight" id="futureValue">$0</div>
        <div class="result-item">
          <span class="label">Total Contributed</span>
          <span class="value" id="contributed">$0</span>
        </div>
        <div class="result-item">
          <span class="label">Interest Earned</span>
          <span class="value" id="interestEarned">$0</span>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand-col">
        <a href="../index.html" class="logo"><span class="logo-dot"></span>CalcHub</a>
        <p class="footer-tagline">Free calculators for finance, health, and daily life.</p>
      </div>
      <nav class="footer-nav">
        <a href="../about.html">About</a>
        <a href="../contact.html">Contact</a>
        <a href="../privacy.html">Privacy</a>
        <a href="../terms.html">Terms</a>
      </nav>
      <p class="footer-copy">© <span id="year"></span> CalcHub</p>
    </div>
  </footer>

  <script src="../script.js"></script>
  <script>
    function calcCompound() {
      const P = parseFloat(document.getElementById('principal').value);
      const PMT = parseFloat(document.getElementById('monthly').value);
      const annualRate = parseFloat(document.getElementById('rate').value) / 100;
      const years = parseFloat(document.getElementById('years').value);
      if (P < 0 || annualRate < 0 || years <= 0) return;
      const monthlyRate = annualRate / 12;
      const months = years * 12;
      const principalFV = P * Math.pow(1 + monthlyRate, months);
      let contributionsFV = monthlyRate > 0 ? PMT * ((Math.pow(1 + monthlyRate, months) - 1) / monthlyRate) : PMT * months;
      const futureValue = principalFV + contributionsFV;
      const contributed = P + PMT * months;
      const interestEarned = futureValue - contributed;
      document.getElementById('futureValue').textContent = formatCurrency(futureValue);
      document.getElementById('contributed').textContent = formatCurrency(contributed);
      document.getElementById('interestEarned').textContent = formatCurrency(interestEarned);
      showResult('result');
    }
  </script>
</body>
</html>
