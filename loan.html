<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Calculator — CalcHub</title>
  <meta name="description" content="Free loan calculator. Calculate monthly payments and total interest on any loan.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text x='50' y='70' font-size='62' text-anchor='middle' fill='white' font-family='system-ui' font-weight='bold'>C</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="../index.html" class="logo"><span class="logo-dot"></span>CalcHub</a>
      <nav class="nav">
        <a href="../index.html#finance">Finance</a>
        <a href="../index.html#health">Health</a>
        <a href="../index.html#daily">Daily</a>
        <a href="../index.html#utility">Utility</a>
      </nav>
    </div>
  </header>

  <main class="calc-page">
    <div class="calc-container">
      <a href="../index.html" class="back-link">← All calculators</a>
      <h1>Loan Calculator</h1>
      <p class="subtitle">Calculate monthly payments and total cost.</p>

      <div class="form-group">
        <label for="amount">Loan Amount ($)</label>
        <input type="number" id="amount" value="10000">
      </div>

      <div class="form-group">
        <label for="rate">Annual Interest Rate (%)</label>
        <input type="number" id="rate" value="8" step="0.01">
      </div>

      <div class="form-group">
        <label for="term">Loan Term (months)</label>
        <input type="number" id="term" value="36">
      </div>

      <button class="calc-btn" onclick="calculateLoan()"><span>Calculate</span></button>

      <div class="result" id="result">
        <h2>Monthly Payment</h2>
        <div class="highlight" id="monthlyPayment">$0</div>
        <div class="result-item">
          <span class="label">Total Interest</span>
          <span class="value" id="totalInterest">$0</span>
        </div>
        <div class="result-item">
          <span class="label">Total Paid</span>
          <span class="value" id="totalPaid">$0</span>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand-col">
        <a href="../index.html" class="logo"><span class="logo-dot"></span>CalcHub</a>
        <p class="footer-tagline">Free calculators for finance, health, and daily life.</p>
      </div>
      <nav class="footer-nav">
        <a href="../about.html">About</a>
        <a href="../contact.html">Contact</a>
        <a href="../privacy.html">Privacy</a>
        <a href="../terms.html">Terms</a>
      </nav>
      <p class="footer-copy">© <span id="year"></span> CalcHub</p>
    </div>
  </footer>

  <script src="../script.js"></script>
  <script>
    function calculateLoan() {
      const P = parseFloat(document.getElementById('amount').value);
      const r = parseFloat(document.getElementById('rate').value) / 100 / 12;
      const n = parseFloat(document.getElementById('term').value);
      if (P <= 0 || r <= 0 || n <= 0) return;
      const monthly = (P * r) / (1 - Math.pow(1 + r, -n));
      const totalPaid = monthly * n;
      const totalInterest = totalPaid - P;
      document.getElementById('monthlyPayment').textContent = formatCurrency(monthly);
      document.getElementById('totalInterest').textContent = formatCurrency(totalInterest);
      document.getElementById('totalPaid').textContent = formatCurrency(totalPaid);
      showResult('result');
    }
  </script>
</body>
</html>
