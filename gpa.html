<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPA Calculator — CalcHub</title>
  <meta name="description" content="Free GPA calculator. Calculate your semester and cumulative grade point average.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text x='50' y='70' font-size='62' text-anchor='middle' fill='white' font-family='system-ui' font-weight='bold'>C</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="../index.html" class="logo"><span class="logo-dot"></span>CalcHub</a>
      <nav class="nav">
        <a href="../index.html#finance">Finance</a>
        <a href="../index.html#health">Health</a>
        <a href="../index.html#daily">Daily</a>
        <a href="../index.html#utility">Utility</a>
      </nav>
    </div>
  </header>

  <main class="calc-page">
    <div class="calc-container">
      <a href="../index.html" class="back-link">← All calculators</a>
      <h1>GPA Calculator</h1>
      <p class="subtitle">Calculate your grade point average.</p>

      <div id="courses"></div>

      <button class="calc-btn" onclick="addCourse()" style="background:#f1f5f9;color:var(--text);box-shadow:none;margin-bottom:12px"><span>+ Add Course</span></button>
      <button class="calc-btn" onclick="calcGPA()"><span>Calculate GPA</span></button>

      <div class="result" id="result">
        <h2>Your GPA</h2>
        <div class="highlight" id="gpaValue">0.00</div>
        <div class="result-item"><span class="label">Total Credits</span><span class="value" id="totalCredits">0</span></div>
        <div class="result-item"><span class="label">Total Points</span><span class="value" id="totalPoints">0</span></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand-col">
        <a href="../index.html" class="logo"><span class="logo-dot"></span>CalcHub</a>
        <p class="footer-tagline">Free calculators for finance, health, and daily life.</p>
      </div>
      <nav class="footer-nav">
        <a href="../about.html">About</a>
        <a href="../contact.html">Contact</a>
        <a href="../privacy.html">Privacy</a>
        <a href="../terms.html">Terms</a>
      </nav>
      <p class="footer-copy">© <span id="year"></span> CalcHub</p>
    </div>
  </footer>

  <script src="../script.js"></script>
  <script>
    const grades = { 'A': 4.0, 'A-': 3.7, 'B+': 3.3, 'B': 3.0, 'B-': 2.7, 'C+': 2.3, 'C': 2.0, 'C-': 1.7, 'D': 1.0, 'F': 0.0 };
    function addCourse() {
      const div = document.createElement('div');
      div.className = 'form-group';
      div.style.display = 'flex';
      div.style.gap = '8px';
      div.innerHTML = `
        <input type="text" placeholder="Course" style="flex:2" class="course-name">
        <input type="number" placeholder="Credits" value="3" style="flex:1" class="course-credits">
        <select class="course-grade" style="flex:1">
          ${Object.keys(grades).map(g => `<option value="${g}">${g}</option>`).join('')}
        </select>`;
      document.getElementById('courses').appendChild(div);
    }
    function calcGPA() {
      const rows = document.querySelectorAll('#courses > div');
      let totalCredits = 0, totalPoints = 0;
      rows.forEach(row => {
        const c = parseFloat(row.querySelector('.course-credits').value) || 0;
        const g = row.querySelector('.course-grade').value;
        totalCredits += c;
        totalPoints += c * grades[g];
      });
      if (totalCredits === 0) return;
      document.getElementById('gpaValue').textContent = (totalPoints / totalCredits).toFixed(2);
      document.getElementById('totalCredits').textContent = totalCredits;
      document.getElementById('totalPoints').textContent = totalPoints.toFixed(2);
      showResult('result');
    }
    addCourse(); addCourse(); addCourse();
  </script>
</body>
</html>
