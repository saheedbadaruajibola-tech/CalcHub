<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mortgage Calculator — CalcHub</title>
  <meta name="description" content="Free mortgage calculator. Estimate monthly payments, total interest, and full loan cost.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text x='50' y='70' font-size='62' text-anchor='middle' fill='white' font-family='system-ui' font-weight='bold'>C</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="../index.html" class="logo">CalcHub</a>
      <nav class="nav">
        <a href="../index.html#finance">Finance</a>
        <a href="../index.html#health">Health</a>
        <a href="../index.html#daily">Daily</a>
        <a href="../index.html#utility">Utility</a>
      </nav>
    </div>
  </header>

  <main class="calc-page">
    <div class="calc-container">
      <a href="../index.html" class="back-link">← All calculators</a>

      <h1>Mortgage Calculator</h1>
      <p class="subtitle">Estimate your monthly mortgage payment.</p>

      <div class="form-group">
        <label for="homePrice">Home Price ($)</label>
        <input type="number" id="homePrice" value="300000">
      </div>

      <div class="form-group">
        <label for="downPayment">Down Payment ($)</label>
        <input type="number" id="downPayment" value="60000">
      </div>

      <div class="form-group">
        <label for="interestRate">Annual Interest Rate (%)</label>
        <input type="number" id="interestRate" value="6.5" step="0.01">
      </div>

      <div class="form-group">
        <label for="loanTerm">Loan Term (years)</label>
        <input type="number" id="loanTerm" value="30">
      </div>

      <button class="calc-btn" onclick="calculateMortgage()">Calculate</button>

      <div class="result" id="result">
        <h2>Monthly Payment</h2>
        <div class="highlight" id="monthlyPayment">$0</div>
        <div class="result-item">
          <span class="label">Loan Amount</span>
          <span class="value" id="loanAmount">$0</span>
        </div>
        <div class="result-item">
          <span class="label">Total Interest</span>
          <span class="value" id="totalInterest">$0</span>
        </div>
        <div class="result-item">
          <span class="label">Total Paid</span>
          <span class="value" id="totalPaid">$0</span>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <p class="footer-brand">CalcHub</p>
      <nav class="footer-nav">
        <a href="../about.html">About</a>
        <a href="../contact.html">Contact</a>
        <a href="../privacy.html">Privacy</a>
        <a href="../terms.html">Terms</a>
      </nav>
      <p class="footer-copy">© <span id="year"></span> CalcHub</p>
    </div>
  </footer>

  <script src="../script.js"></script>
  <script>
    function calculateMortgage() {
      const price = parseFloat(document.getElementById('homePrice').value);
      const down = parseFloat(document.getElementById('downPayment').value);
      const rate = parseFloat(document.getElementById('interestRate').value) / 100 / 12;
      const term = parseFloat(document.getElementById('loanTerm').value) * 12;

      const loan = price - down;
      if (loan <= 0 || rate <= 0 || term <= 0) return;

      const monthly = (loan * rate) / (1 - Math.pow(1 + rate, -term));
      const totalPaid = monthly * term;
      const totalInterest = totalPaid - loan;

      document.getElementById('monthlyPayment').textContent = formatCurrency(monthly);
      document.getElementById('loanAmount').textContent = formatCurrency(loan);
      document.getElementById('totalInterest').textContent = formatCurrency(totalInterest);
      document.getElementById('totalPaid').textContent = formatCurrency(totalPaid);
      showResult('result');
    }
  </script>
</body>
</html>
