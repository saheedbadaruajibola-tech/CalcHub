<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator — CalcHub</title>
  <meta name="description" content="Free BMI calculator. Check your Body Mass Index and healthy weight range.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text x='50' y='70' font-size='62' text-anchor='middle' fill='white' font-family='system-ui' font-weight='bold'>C</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="../index.html" class="logo"><span class="logo-dot"></span>CalcHub</a>
      <nav class="nav">
        <a href="../index.html#finance">Finance</a>
        <a href="../index.html#health">Health</a>
        <a href="../index.html#daily">Daily</a>
        <a href="../index.html#utility">Utility</a>
      </nav>
    </div>
  </header>

  <main class="calc-page">
    <div class="calc-container">
      <a href="../index.html" class="back-link">← All calculators</a>
      <h1>BMI Calculator</h1>
      <p class="subtitle">Check your Body Mass Index.</p>

      <div class="form-group">
        <label for="unit">Unit System</label>
        <select id="unit" onchange="toggleUnits()">
          <option value="metric">Metric (kg, cm)</option>
          <option value="imperial">Imperial (lb, in)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="weight" id="weightLabel">Weight (kg)</label>
        <input type="number" id="weight" value="70">
      </div>

      <div class="form-group">
        <label for="height" id="heightLabel">Height (cm)</label>
        <input type="number" id="height" value="175">
      </div>

      <button class="calc-btn" onclick="calculateBMI()"><span>Calculate BMI</span></button>

      <div class="result" id="result">
        <h2>Your BMI</h2>
        <div class="highlight" id="bmiValue">0</div>
        <div class="result-item">
          <span class="label">Category</span>
          <span class="value" id="bmiCategory">—</span>
        </div>
        <div class="result-item">
          <span class="label">Healthy Range</span>
          <span class="value" id="healthyRange">—</span>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand-col">
        <a href="../index.html" class="logo"><span class="logo-dot"></span>CalcHub</a>
        <p class="footer-tagline">Free calculators for finance, health, and daily life.</p>
      </div>
      <nav class="footer-nav">
        <a href="../about.html">About</a>
        <a href="../contact.html">Contact</a>
        <a href="../privacy.html">Privacy</a>
        <a href="../terms.html">Terms</a>
      </nav>
      <p class="footer-copy">© <span id="year"></span> CalcHub</p>
    </div>
  </footer>

  <script src="../script.js"></script>
  <script>
    function toggleUnits() {
      const isMetric = document.getElementById('unit').value === 'metric';
      document.getElementById('weightLabel').textContent = isMetric ? 'Weight (kg)' : 'Weight (lb)';
      document.getElementById('heightLabel').textContent = isMetric ? 'Height (cm)' : 'Height (in)';
      document.getElementById('weight').value = isMetric ? 70 : 154;
      document.getElementById('height').value = isMetric ? 175 : 69;
    }
    function calculateBMI() {
      const unit = document.getElementById('unit').value;
      let weight = parseFloat(document.getElementById('weight').value);
      let height = parseFloat(document.getElementById('height').value);
      if (weight <= 0 || height <= 0) return;
      let bmi = unit === 'metric' ? weight / Math.pow(height/100, 2) : (weight / Math.pow(height, 2)) * 703;
      let category = bmi < 18.5 ? 'Underweight' : bmi < 25 ? 'Normal weight' : bmi < 30 ? 'Overweight' : 'Obese';
      let minW, maxW, rangeUnit;
      if (unit === 'metric') { minW = 18.5 * Math.pow(height/100, 2); maxW = 24.9 * Math.pow(height/100, 2); rangeUnit = 'kg'; }
      else { minW = (18.5 * Math.pow(height, 2)) / 703; maxW = (24.9 * Math.pow(height, 2)) / 703; rangeUnit = 'lb'; }
      document.getElementById('bmiValue').textContent = bmi.toFixed(1);
      document.getElementById('bmiCategory').textContent = category;
      document.getElementById('healthyRange').textContent = `${minW.toFixed(1)} – ${maxW.toFixed(1)} ${rangeUnit}`;
      showResult('result');
    }
  </script>
</body>
</html>
