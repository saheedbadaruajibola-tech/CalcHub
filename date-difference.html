<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date Difference Calculator — CalcHub</title>
  <meta name="description" content="Free date difference calculator. Count days, weeks, and business days between two dates.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text x='50' y='70' font-size='62' text-anchor='middle' fill='white' font-family='system-ui' font-weight='bold'>C</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="../index.html" class="logo"><span class="logo-dot"></span>CalcHub</a>
      <nav class="nav">
        <a href="../index.html#finance">Finance</a>
        <a href="../index.html#health">Health</a>
        <a href="../index.html#daily">Daily</a>
        <a href="../index.html#utility">Utility</a>
      </nav>
    </div>
  </header>

  <main class="calc-page">
    <div class="calc-container">
      <a href="../index.html" class="back-link">← All calculators</a>
      <h1>Date Difference Calculator</h1>
      <p class="subtitle">Find the time between two dates.</p>

      <div class="form-group">
        <label for="startDate">Start Date</label>
        <input type="date" id="startDate">
      </div>
      <div class="form-group">
        <label for="endDate">End Date</label>
        <input type="date" id="endDate">
      </div>

      <button class="calc-btn" onclick="calcDateDiff()"><span>Calculate</span></button>

      <div class="result" id="result">
        <h2>Difference</h2>
        <div class="highlight" id="daysDiff">0 days</div>
        <div class="result-item"><span class="label">Weeks</span><span class="value" id="weeksDiff">0</span></div>
        <div class="result-item"><span class="label">Months</span><span class="value" id="monthsDiff">0</span></div>
        <div class="result-item"><span class="label">Years</span><span class="value" id="yearsDiff">0</span></div>
        <div class="result-item"><span class="label">Business Days</span><span class="value" id="businessDays">0</span></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand-col">
        <a href="../index.html" class="logo"><span class="logo-dot"></span>CalcHub</a>
        <p class="footer-tagline">Free calculators for finance, health, and daily life.</p>
      </div>
      <nav class="footer-nav">
        <a href="../about.html">About</a>
        <a href="../contact.html">Contact</a>
        <a href="../privacy.html">Privacy</a>
        <a href="../terms.html">Terms</a>
      </nav>
      <p class="footer-copy">© <span id="year"></span> CalcHub</p>
    </div>
  </footer>

  <script src="../script.js"></script>
  <script>
    document.getElementById('endDate').valueAsDate = new Date();
    function calcDateDiff() {
      const s = document.getElementById('startDate').value;
      const e = document.getElementById('endDate').value;
      if (!s || !e) return;
      let start = new Date(s), end = new Date(e);
      if (start > end) [start, end] = [end, start];
      const diffMs = end - start;
      const totalDays = Math.floor(diffMs / 86400000);
      let years = end.getFullYear() - start.getFullYear();
      let months = end.getMonth() - start.getMonth();
      let days = end.getDate() - start.getDate();
      if (days < 0) { months--; days += new Date(end.getFullYear(), end.getMonth(), 0).getDate(); }
      if (months < 0) { years--; months += 12; }
      let businessDays = 0;
      const cursor = new Date(start);
      while (cursor <= end) { const d = cursor.getDay(); if (d !== 0 && d !== 6) businessDays++; cursor.setDate(cursor.getDate() + 1); }
      document.getElementById('daysDiff').textContent = totalDays.toLocaleString() + ' days';
      document.getElementById('weeksDiff').textContent = Math.floor(totalDays / 7).toLocaleString();
      document.getElementById('monthsDiff').textContent = (years * 12 + months).toLocaleString();
      document.getElementById('yearsDiff').textContent = `${years}y ${months}m ${days}d`;
      document.getElementById('businessDays').textContent = businessDays.toLocaleString();
      showResult('result');
    }
  </script>
</body>
</html>
