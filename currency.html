<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter — CalcHub</title>
  <meta name="description" content="Free currency converter with live exchange rates. Convert USD, EUR, GBP, NGN, and more.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text x='50' y='70' font-size='62' text-anchor='middle' fill='white' font-family='system-ui' font-weight='bold'>C</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="../index.html" class="logo"><span class="logo-dot"></span>CalcHub</a>
      <nav class="nav">
        <a href="../index.html#finance">Finance</a>
        <a href="../index.html#health">Health</a>
        <a href="../index.html#daily">Daily</a>
        <a href="../index.html#utility">Utility</a>
      </nav>
    </div>
  </header>

  <main class="calc-page">
    <div class="calc-container">
      <a href="../index.html" class="back-link">← All calculators</a>
      <h1>Currency Converter</h1>
      <p class="subtitle">Live exchange rates from a free API.</p>

      <div class="form-group"><label for="amount">Amount</label><input type="number" id="amount" value="100" step="0.01"></div>
      <div class="form-group"><label for="from">From</label><select id="from"></select></div>
      <div class="form-group"><label for="to">To</label><select id="to"></select></div>

      <button class="calc-btn" onclick="convertCurrency()"><span>Convert</span></button>

      <div class="result" id="result">
        <h2>Converted Amount</h2>
        <div class="highlight" id="converted">—</div>
        <div class="result-item"><span class="label">Exchange Rate</span><span class="value" id="rateInfo">—</span></div>
        <div class="result-item"><span class="label">Last Updated</span><span class="value" id="updated">—</span></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand-col">
        <a href="../index.html" class="logo"><span class="logo-dot"></span>CalcHub</a>
        <p class="footer-tagline">Free calculators for finance, health, and daily life.</p>
      </div>
      <nav class="footer-nav">
        <a href="../about.html">About</a>
        <a href="../contact.html">Contact</a>
        <a href="../privacy.html">Privacy</a>
        <a href="../terms.html">Terms</a>
      </nav>
      <p class="footer-copy">© <span id="year"></span> CalcHub</p>
    </div>
  </footer>

  <script src="../script.js"></script>
  <script>
    const currencies = ['USD','EUR','GBP','NGN','JPY','CAD','AUD','INR','CNY','ZAR','GHS','KES','EGP','BRL','MXN'];
    const fromSel = document.getElementById('from'), toSel = document.getElementById('to');
    currencies.forEach(c => { fromSel.innerHTML += `<option value="${c}">${c}</option>`; toSel.innerHTML += `<option value="${c}">${c}</option>`; });
    fromSel.value = 'USD'; toSel.value = 'NGN';
    async function convertCurrency() {
      const amount = parseFloat(document.getElementById('amount').value);
      const from = fromSel.value, to = toSel.value;
      if (amount <= 0) return;
      try {
        const res = await fetch(`https://api.exchangerate-api.com/v4/latest/${from}`);
        const data = await res.json();
        const rate = data.rates[to];
        const converted = amount * rate;
        document.getElementById('converted').textContent = converted.toLocaleString('en-US', { style: 'currency', currency: to, maximumFractionDigits: 2 });
        document.getElementById('rateInfo').textContent = `1 ${from} = ${rate.toFixed(4)} ${to}`;
        document.getElementById('updated').textContent = data.date;
        showResult('result');
      } catch (err) { alert('Could not fetch exchange rates.'); }
    }
  </script>
</body>
</html>
